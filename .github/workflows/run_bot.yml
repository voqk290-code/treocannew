name: Run Python Bot 24/7

on:
  push:
    branches: [ main ]  # Tự động chạy khi bạn push code mới
  schedule:
    - cron: '0 */4 * * *' # Cứ mỗi 4 tiếng hệ thống tự bật lại để treo liên tục
  workflow_dispatch:      # Kích hoạt nút bấm chạy thủ công trên giao diện web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requi.txt ]; then pip install -r requi.txt; fi

    - name: Run Script
      run: python spamcannew.py # Thay main.py bằng file chạy chính của bạn
